[".config/k9s/skins"]
type            = "archive"
url             = "https://github.com/catppuccin/k9s/archive/main.tar.gz"
include         = ["k9s-main/dist/**"]
stripComponents = 2
refreshPeriod   = "168h"

[".local/share/tmux/plugins/tpm"]
type      = "git-repo"
url       = "https://github.com/tmux-plugins/tpm"
pull.args = ["--ff-only"]

# Manage NVM's code while preserving installed Node versions, aliases, and cache.
[".local/share/nvm"]
type            = "archive"
url             = "https://github.com/nvm-sh/nvm/archive/refs/tags/v0.41.0.tar.gz"
checksum.sha256 = "532560c9ecc6ef484279fcc1c600e9346537bc7913b891ffd0ec0caca5072694"
stripComponents = 1
exact           = false
include         = [
  "*/nvm.sh",
  "*/nvm-exec",
  "*/bash_completion",
  "*/LICENSE.md"
]

[".local/src/neovim"]
type      = "git-repo"
url       = "https://github.com/neovim/neovim.git"
pull.args = ["--ff-only", "--force"]

[".local/src/typeshed"]
type      = "git-repo"
url       = "https://github.com/python/typeshed.git"
pull.args = ["--ff-only"]

["./Projects/nvim/conform.nvim"]
type      = "git-repo"
url       = "https://github.com/William-Blackie/conform.nvim"
pull.args = ["--ff-only"]

["./Projects/nvim/nvim-lspconfig"]
type      = "git-repo"
url       = "https://github.com/William-Blackie/nvim-lspconfig"
pull.args = ["--ff-only"]

["./Projects/nvim/grove.nvim"]
type      = "git-repo"
url       = "https://github.com/William-Blackie/grove.nvim"
pull.args = ["--ff-only"]

["./Projects/nvim/neotest-python"]
type      = "git-repo"
url       = "https://github.com/William-Blackie/neotest-python.git"
pull.args = ["--ff-only"]

["./Projects/nvim/nvim-lint"]
type      = "git-repo"
url       = "https://github.com/William-Blackie/nvim-lint"
pull.args = ["--ff-only"]
