name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build shared tool profile
        run: |
          nix build ./.nix#default -o /tmp/dotfiles-tools
          echo "/tmp/dotfiles-tools/bin" >> "$GITHUB_PATH"

      - name: Install zsh
        run: |
          nix build nixpkgs#zsh -o /tmp/zsh
          echo "/tmp/zsh/bin" >> "$GITHUB_PATH"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      # test-neovim needs the lazy.nvim plugin cache from a real machine; skip it here.
      - run:
          make format-check lint test-python test-nix test-onepassword
          test-secrets test-vorssaint
