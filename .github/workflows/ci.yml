name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build shared tool profile
        run: |
          nix build ./.nix#default -o /tmp/dotfiles-tools
          echo "/tmp/dotfiles-tools/bin" >> "$GITHUB_PATH"

      - name: Install Neovim
        run: |
          nix build nixpkgs#neovim -o /tmp/nvim
          echo "/tmp/nvim/bin" >> "$GITHUB_PATH"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - run: make check
